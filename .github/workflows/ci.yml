name: pipeline-ci

# Usa a amostra versionada (data/sample), entao nao precisa do dataset do Kaggle.
#
# Dois modos (docs/confiabilidade.md):
# - pull_request: roda uma vez por PR e constroi so o que mudou no dbt em
#   relacao a branch base (state:modified). PR so de docs ou de ML nao
#   reconstroi nenhum model.
# - push na main: build completo e validacao incremental, a rede de seguranca
#   depois do merge.
# Antes, o push em qualquer branch tambem disparava: cada PR rodava duas vezes.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: olist
          POSTGRES_USER: olist
          POSTGRES_PASSWORD: olist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: olist
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: olist
      OLIST_DATA_DIR: data/sample

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o PR precisa da branch base para comparar o estado

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-ml.txt

      # Testes do modelo de atraso: lista permitida, cortes temporais, custo,
      # limiar e PSI. O treino real nao roda aqui: 800 pedidos nao dao
      # metrica que signifique algo.
      - name: Testes Python (ML)
        run: python -m pytest tests -q

      - name: Ingestao da amostra
        run: python ingestion/ingest.py

      # Idade da carga (coluna _carregado_em), recem-feita: deve passar.
      - name: dbt source freshness
        working-directory: dbt
        run: dbt source freshness --profiles-dir .

      # ---- Pull request: so o que mudou ----

      # Manifest da branch base, gerado num worktree a parte (dbt parse nao
      # precisa de banco). E a referencia do state:modified.
      - name: Estado da branch base (PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}   # via env, nunca interpolado direto no shell
        run: |
          git worktree add "$RUNNER_TEMP/base" "origin/$BASE_REF"
          cd "$RUNNER_TEMP/base/dbt"
          dbt parse --profiles-dir . --target-path "$RUNNER_TEMP/estado_base"

      # "+state:modified+": o que mudou, o que depende disso e tambem os
      # ancestrais. Os ancestrais entram porque o banco do CI comeca vazio e nao
      # existe ambiente de producao para --defer. Num warehouse de verdade, o
      # certo seria "state:modified+ --defer --state <manifest de producao>".
      - name: Selecao do dbt (PR)
        if: github.event_name == 'pull_request'
        id: selecao
        working-directory: dbt
        run: |
          set -o pipefail   # sem isso, uma falha do dbt ls some atras do tee
          dbt --quiet ls --profiles-dir . --select +state:modified+ \
            --state "$RUNNER_TEMP/estado_base" --resource-type model --output name \
            | tee "$RUNNER_TEMP/selecao.txt"
          echo "models selecionados: $(grep -c . "$RUNNER_TEMP/selecao.txt" || true)"
          if grep -qxE 'fato_pedidos|fato_itens_pedido' "$RUNNER_TEMP/selecao.txt"; then
            echo "fatos=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: dbt build so do que mudou (PR)
        if: github.event_name == 'pull_request'
        working-directory: dbt
        # buildable: teste que le um model fora da selecao nao entra. Sem isso, um
        # PR que muda so uma dimensao seleciona o relationships do fato, que
        # aponta para ela, e o teste falha porque o fato nao foi construido.
        run: >-
          dbt build --profiles-dir . --select +state:modified+
          --state "$RUNNER_TEMP/estado_base" --indirect-selection buildable

      # ---- Push na main: tudo ----

      - name: dbt build completo (main)
        if: github.event_name == 'push'
        working-directory: dbt
        run: dbt build --profiles-dir .

      # Na main sempre; no PR, so quando os fatos incrementais estao na selecao.
      - name: Validar incrementalidade, janela e metadados (banco descartavel)
        if: github.event_name == 'push' || steps.selecao.outputs.fatos == 'sim'
        run: python scripts/validate_incremental.py
