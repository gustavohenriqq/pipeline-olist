# Tema base do app: escuro, destaque verde menta. O claro e o botao de troca ficam
# em agente/tema.py (CSS por sessao, que o config.toml nao faz).
[theme]
base = "dark"
primaryColor = "#34D399"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#162033"
textColor = "#E2E8F0"

[browser]
gatherUsageStats = false
