name: pipeline-ci

# Usa a amostra versionada (data/sample), entao nao precisa do dataset do Kaggle.
#
# Dois modos (docs/confiabilidade.md):
# - pull_request: roda uma vez por PR e constroi so o que mudou no dbt em
#   relacao a branch base (state:modified). PR so de docs ou de ML nao
#   reconstroi nenhum model. Excecao: PR que mexe no painel ou na infra
#   (ingestao, validacao, hooks do dbt, o proprio CI) faz build completo.
# - push na main: build completo e validacao incremental, a rede de seguranca
#   depois do merge.
# Antes, o push em qualquer branch tambem disparava: cada PR rodava duas vezes.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: olist
          POSTGRES_USER: olist
          POSTGRES_PASSWORD: olist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: olist
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: olist
      OLIST_DATA_DIR: data/sample

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o PR precisa da branch base para comparar o estado

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-ml.txt -r agente/requirements.txt

      # Testes do modelo de atraso: lista permitida, cortes temporais, custo,
      # limiar e PSI. O treino real nao roda aqui: 800 pedidos nao dao
      # metrica que signifique algo.
      - name: Testes Python (ML e agente)
        run: python -m pytest tests -q --ignore=tests/integracao

      - name: Ingestao da amostra
        run: python ingestion/ingest.py

      # Idade da carga (coluna _carregado_em), recem-feita: deve passar.
      - name: dbt source freshness
        working-directory: dbt
        run: dbt source freshness --profiles-dir .

      # ---- Pull request: so o que mudou ----

      # Manifest da branch base, gerado num worktree a parte (dbt parse nao
      # precisa de banco). E a referencia do state:modified.
      - name: Estado da branch base (PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}   # via env, nunca interpolado direto no shell
        run: |
          git worktree add "$RUNNER_TEMP/base" "origin/$BASE_REF"
          cd "$RUNNER_TEMP/base/dbt"
          dbt parse --profiles-dir . --target-path "$RUNNER_TEMP/estado_base"

      # "@state:modified": o que mudou, o que depende disso e todos os
      # ancestrais desses dependentes. O banco do CI comeca vazio e nao existe
      # producao para --defer, entao cada model selecionado precisa ter todos os
      # pais construidos. "+state:modified+" nao basta: mudar dim_produtos
      # seleciona obt_itens, que tambem le fato_itens_pedido, e o fato ficava de
      # fora. Num warehouse de verdade, o certo seria
      # "state:modified+ --defer --state <manifest de producao>".
      - name: Selecao do dbt (PR)
        if: github.event_name == 'pull_request'
        id: selecao
        working-directory: dbt
        run: |
          set -o pipefail   # sem isso, uma falha do dbt ls some atras do tee
          dbt --quiet ls --profiles-dir . --select @state:modified \
            --state "$RUNNER_TEMP/estado_base" --resource-type model --output name \
            | tee "$RUNNER_TEMP/selecao.txt"
          echo "models selecionados: $(grep -c . "$RUNNER_TEMP/selecao.txt" || true)"
          if grep -qxE 'fato_pedidos|fato_itens_pedido' "$RUNNER_TEMP/selecao.txt"; then
            echo "fatos=sim" >> "$GITHUB_OUTPUT"
          fi

      # O state:modified so enxerga models, seeds, testes e as macros que eles
      # chamam. Dois grupos de caminhos ficam fora disso e pedem build completo:
      # - painel: le as marts de verdade e confere os numeros contra o esperado
      #   do Power BI, entao precisa das marts inteiras;
      # - infra: ingestao, validacao incremental, hooks do dbt (metadados.sql,
      #   previsao_atraso.sql), generate_schema_name, dbt_project.yml,
      #   requirements e o proprio CI. Mudar so isso selecionava zero models, e
      #   build e validacao so rodavam depois do merge, na main.
      # Na amostra, o build completo leva menos de um minuto.
      - name: Arquivos alterados fora do dbt (PR)
        if: github.event_name == 'pull_request'
        id: arquivos
        env:
          BASE_REF: ${{ github.base_ref }}
          PADRAO_PAINEL: '^(painel/|agente/|tests/integracao/test_painel|dashboards/powerbi/conferencia/)'
          PADRAO_INFRA: '^(ingestion/|scripts/validate_incremental\.py|dbt/dbt_project\.yml|dbt/macros/(metadados|previsao_atraso|generate_schema_name)\.sql|requirements\.txt|\.github/workflows/)'
        run: |
          git diff --name-only "origin/$BASE_REF"...HEAD > "$RUNNER_TEMP/alterados.txt"
          cat "$RUNNER_TEMP/alterados.txt"
          if grep -qE "$PADRAO_PAINEL" "$RUNNER_TEMP/alterados.txt"; then
            echo "painel=sim" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE "$PADRAO_INFRA" "$RUNNER_TEMP/alterados.txt"; then
            echo "infra=sim" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE "$PADRAO_PAINEL|$PADRAO_INFRA" "$RUNNER_TEMP/alterados.txt"; then
            echo "completo=sim" >> "$GITHUB_OUTPUT"
          fi

      # "--indirect-selection cautious": teste so entra se todos os pais dele
      # foram selecionados. Sem isso, um model novo que le fato_pedidos (como
      # distancia_pedido) puxa o fato como ancestral e, com ele, os testes de
      # relationships do fato com dim_clientes, dim_tempo etc., que nao estao na
      # selecao e nao existem no banco vazio do CI ("relation does not exist").
      - name: dbt build so do que mudou (PR)
        if: github.event_name == 'pull_request' && steps.arquivos.outputs.completo != 'sim'
        working-directory: dbt
        run: dbt build --profiles-dir . --select @state:modified --state "$RUNNER_TEMP/estado_base" --indirect-selection cautious

      - name: dbt build completo (PR que mexe no painel ou na infra)
        if: github.event_name == 'pull_request' && steps.arquivos.outputs.completo == 'sim'
        working-directory: dbt
        run: dbt build --profiles-dir .

      # ---- Push na main: tudo ----

      - name: dbt build completo (main)
        if: github.event_name == 'push'
        working-directory: dbt
        run: dbt build --profiles-dir .

      # Os testes de integracao pulam com "Postgres indisponivel" quando o banco
      # nao responde (bom para quem roda local sem Docker). Aqui o plugin
      # scripts/pytest_exige_banco.py transforma esse skip em falha e exige pelo
      # menos um teste aprovado: sem ele, banco fora deixava o passo verde.

      # Permissoes reais do usuario do agente: le so as marts permitidas, nao
      # escreve, nao passa do tempo. Cria tabelas minimas se o PR nao construiu.
      - name: Testes de integracao do agente (permissoes no banco)
        env:
          PYTHONPATH: scripts
        run: python -m pytest tests/integracao/test_agente_permissoes.py -q -p pytest_exige_banco

      # Numeros do painel contra o esperado.sql do Power BI: so com as marts
      # inteiras (main, ou PR com build completo). Nunca contra tabela minima.
      - name: Numeros do painel contra o Power BI
        if: github.event_name == 'push' || steps.arquivos.outputs.completo == 'sim'
        env:
          PYTHONPATH: scripts
        run: python -m pytest tests/integracao/test_painel_numeros.py -q -p pytest_exige_banco

      # Na main sempre; no PR, quando os fatos incrementais estao na selecao ou
      # quando muda a infra (ingestao, hooks de metadados, o proprio script).
      - name: Validar incrementalidade, janela e metadados (banco descartavel)
        if: >-
          github.event_name == 'push'
          || steps.selecao.outputs.fatos == 'sim'
          || steps.arquivos.outputs.infra == 'sim'
        run: python scripts/validate_incremental.py
