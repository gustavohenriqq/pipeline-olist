version: 2

models:
  - name: dim_clientes
    description: Dimensao de clientes no grao de pessoa (customer_unique_id).
    columns:
      - name: cliente_sk
        description: Chave substituta (surrogate key) do cliente.
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [unique, not_null]
      - name: regiao
        description: Regiao do Brasil derivada da UF.
        data_tests:
          - accepted_values:
              values: ["Norte", "Nordeste", "Centro-Oeste", "Sudeste", "Sul", "Desconhecida"]

  - name: dim_vendedores
    description: Dimensao de vendedores.
    columns:
      - name: vendedor_sk
        data_tests: [unique, not_null]
      - name: seller_id
        data_tests: [unique, not_null]

  - name: dim_produtos
    description: Dimensao de produtos com categoria PT/EN.
    columns:
      - name: produto_sk
        data_tests: [unique, not_null]
      - name: product_id
        data_tests: [unique, not_null]

  - name: dim_geolocalizacao
    description: Dimensao de geolocalizacao por prefixo de CEP.
    columns:
      - name: geo_sk
        data_tests: [unique, not_null]
      - name: zip_code_prefix
        data_tests: [unique, not_null]

  - name: dim_tempo
    description: Dimensao de calendario diario.
    columns:
      - name: tempo_sk
        data_tests: [unique, not_null]
      - name: data
        data_tests: [unique, not_null]

  - name: fato_pedidos
    description: Fato no grao de pedido, com metricas de valor, pagamento, nota e entrega.
    columns:
      - name: pedido_sk
        data_tests: [unique, not_null]
      - name: order_id
        data_tests: [unique, not_null]
      - name: cliente_sk
        description: FK para dim_clientes.
        data_tests:
          - relationships:
              to: ref('dim_clientes')
              field: cliente_sk
      - name: tempo_sk_compra
        description: FK para dim_tempo (data da compra).
        data_tests:
          - relationships:
              to: ref('dim_tempo')
              field: tempo_sk
              config:
                severity: warn
      - name: geo_sk
        description: FK para dim_geolocalizacao (CEP do cliente). Alguns CEPs de cliente nao existem na base de geolocalizacao, por isso o teste e apenas aviso.
        data_tests:
          - relationships:
              to: ref('dim_geolocalizacao')
              field: geo_sk
              config:
                severity: warn
      - name: nota_avaliacao
        data_tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]
              config:
                severity: warn
      - name: dias_ate_transportadora
        description: >
          Dias entre a compra e a entrega do pacote a transportadora. E a parte
          do tempo sob responsabilidade do vendedor. Teste em aviso: 2 pedidos
          tem valor negativo na base do Olist (transportadora recebendo antes da
          compra), o que e impossivel e indica erro de origem.
        data_tests:
          - valor_minimo:
              min_value: 0
              config:
                severity: warn
      - name: dias_em_transporte
        description: >
          Dias entre a coleta pela transportadora e a entrega ao cliente. E a
          parte do tempo sob responsabilidade da logistica. Teste em aviso: 20
          pedidos tem valor negativo (cliente recebendo antes da coleta).
        data_tests:
          - valor_minimo:
              min_value: 0
              config:
                severity: warn

  - name: fato_itens_pedido
    description: Fato no grao de item do pedido; conecta produto e vendedor.
    columns:
      - name: item_sk
        data_tests: [unique, not_null]
      - name: produto_sk
        description: FK para dim_produtos.
        data_tests:
          - relationships:
              to: ref('dim_produtos')
              field: produto_sk
              config:
                severity: warn
      - name: vendedor_sk
        description: FK para dim_vendedores.
        data_tests:
          - relationships:
              to: ref('dim_vendedores')
              field: vendedor_sk
              config:
                severity: warn

  - name: obt_pedidos
    description: >
      Tabela larga (One Big Table) no grao de pedido, com cliente, tempo e
      geolocalizacao ja resolvidos. Existe para o BI conectado via SQL direto
      (Looker Studio) nao depender de blend entre fontes. Derivada do star
      schema, que continua sendo a fonte da verdade.
    columns:
      - name: pedido_sk
        description: Chave substituta do pedido. Mesmo grao de fato_pedidos.
        data_tests: [unique, not_null]
      - name: order_id
        data_tests: [unique, not_null]
      - name: cliente_regiao
        description: Regiao do Brasil do cliente, derivada da UF.
        data_tests:
          - accepted_values:
              values: ["Norte", "Nordeste", "Centro-Oeste", "Sudeste", "Sul", "Desconhecida"]
      - name: valor_total
        description: Valor de itens mais frete. Nunca negativo.
        data_tests:
          - valor_minimo:
              min_value: 0
      - name: dias_ate_transportadora
        description: Parte do tempo de entrega sob responsabilidade do vendedor.
      - name: dias_em_transporte
        description: >
          Parte do tempo de entrega sob responsabilidade da transportadora.
          Concentra 87% do atraso. Ver docs/analise-atraso.md.

  - name: obt_itens
    description: >
      Tabela larga (One Big Table) no grao de item do pedido, com produto,
      vendedor, cliente e tempo resolvidos. Serve as analises de categoria e de
      performance de vendedor no BI. Complementa obt_pedidos, que e o grao de
      pedido. Nunca somar metricas das duas na mesma visao.
    columns:
      - name: item_sk
        description: Chave substituta do item. Mesmo grao de fato_itens_pedido.
        data_tests: [unique, not_null]
      - name: order_id
        data_tests: [not_null]
      - name: vendedor_regiao
        description: Regiao do Brasil do vendedor, derivada da UF.
        data_tests:
          - accepted_values:
              values: ["Norte", "Nordeste", "Centro-Oeste", "Sudeste", "Sul", "Desconhecida"]
      - name: valor_item
        description: Valor do produto mais o frete rateado do item. Nunca negativo.
        data_tests:
          - valor_minimo:
              min_value: 0
