# Perfil de conexao do dbt.
# Le tudo de variaveis de ambiente (o .env do projeto) para nao ter senha no Git.
# Rode o dbt de dentro da pasta dbt/ com --profiles-dir . (os scripts ja fazem isso).
olist:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'olist') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'olist') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'olist') }}"
      schema: analytics
      threads: 4

