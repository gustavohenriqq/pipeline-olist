name: "olist"
version: "1.0.0"
config-version: 2

# Perfil de conexao (definido em profiles.yml).
profile: "olist"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Convencao de materializacao por camada:
#   staging      -> views  (leves, so renomeiam/limpam a raw)
#   intermediate -> views  (juntam e agregam antes das marts)
#   marts        -> tables; os dois fatos sobrescrevem para incremental
models:
  olist:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
    # Features do modelo de atraso. Schema proprio: nao vai para o Neon,
    # porque o publicador copia so o schema marts.
    ml:
      +materialized: table
      +schema: ml

# Tabela de saida da previsao, escrita pelo Python e testada como source.
# Ver macros/previsao_atraso.sql.
on-run-start:
  - "{{ cria_tabela_previsao() }}"
